# Apex ldeluipy.es (+ www → apex on HTTPS)

<VirtualHost *:80>
    ServerName ldeluipy.es
    ServerAlias www.ldeluipy.es
    ErrorLog ${APACHE_LOG_DIR}/ldeluipy.es.error.log
    CustomLog ${APACHE_LOG_DIR}/ldeluipy.es.access.log combined
    RedirectMatch 301 ^/(.*)$ https://ldeluipy.es/$1
</VirtualHost>

# www HTTPS → apex (avoid duplicate content)
<VirtualHost *:443>
    ServerName www.ldeluipy.es
    ErrorLog ${APACHE_LOG_DIR}/ldeluipy.es.error.log
    CustomLog ${APACHE_LOG_DIR}/ldeluipy.es.access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ldeluipy.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ldeluipy.es/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    RedirectMatch 301 ^/(.*)$ https://ldeluipy.es/$1
</VirtualHost>

<VirtualHost *:443>
    ServerName ldeluipy.es
    DocumentRoot /var/www/ldeluipy.es

    <Directory /var/www/ldeluipy.es>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Mapas: EN file → /en/ path
    RedirectMatch 301 ^/mapa-ecosistema-en\.html$ /en/mapa-ecosistema.html

    # Helio-3 privacy: one canonical policy on helio3.ldeluipy.es
    RedirectMatch 301 ^/helio-3/privacy/?$ https://helio3.ldeluipy.es/privacy/
    RedirectMatch 301 ^/en/helio-3/privacy/?$ https://helio3.ldeluipy.es/en/privacy/

    # Custom 404 (site design). Keep real 404 status — do not redirect to /.
    ErrorDocument 404 /404.html

    # English tree uses its own 404 copy
    <Directory /var/www/ldeluipy.es/en>
        ErrorDocument 404 /en/404.html
    </Directory>

    # No servir carpetas ocultas de tooling (.hallmark, .cursor, .git, …)
    # .well-known queda fuera: HTTP-01 de Let's Encrypt
    <DirectoryMatch "/var/www/ldeluipy\.es/\.(?!well-known(?:/|$))[^/]+">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/ldeluipy.es.error.log
    CustomLog ${APACHE_LOG_DIR}/ldeluipy.es.access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ldeluipy.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ldeluipy.es/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
